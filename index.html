    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23157f6d'/%3E%3Cpath d='M9 21.5V11.8c0-.5.4-.9.9-.8l5.6 1.1c.3.1.5.1.8 0l5.6-1.1c.5-.1.9.3.9.8v9.7c0 .4-.3.8-.7.8l-5.8 1.2c-.2 0-.4 0-.6 0l-5.8-1.2c-.4-.1-.9-.4-.9-.8z' fill='white'/%3E%3C/svg%3E" />

  <body>
    <div id="root"></div>
    <script>
      // Demo aid: browsers pause requestAnimationFrame in hidden tabs, which
      // freezes animation-gated UI transitions. During the two-tab demo the
      // background tab should keep progressing, so fall back to timers while
      // hidden. Remove for production if undesired.
      (function () {
        var nativeRaf = window.requestAnimationFrame.bind(window);
        var nativeCancel = window.cancelAnimationFrame.bind(window);
        window.requestAnimationFrame = function (cb) {
          if (document.hidden) return setTimeout(function () { cb(performance.now()); }, 32);
          return nativeRaf(cb);
        };
        window.cancelAnimationFrame = function (id) { nativeCancel(id); clearTimeout(id); };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
